<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Worth It?</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo">🧠</div>
    <div>
      <h1>Worth It?</h1>
      <p>What you click vs. what you enjoy</p>
    </div>
  </header>

  <section class="today" id="today"></section>

  <section class="controls">
    <label class="row"><span>Blur junk-food thumbnails</span><input type="checkbox" id="blur"></label>
    <label class="row"><span>Show hook badges</span><input type="checkbox" id="badges"></label>
    <label class="row"><span>Ask "Worth it?"</span>
      <select id="askMode">
        <option value="sometimes">Sometimes (max 1 per 10 min)</option>
        <option value="often">After every video</option>
        <option value="never">Never</option>
      </select>
    </label>
    <div class="slider">
      <div class="row"><span>How strict about junk food</span><b id="lambdaVal"></b></div>
      <input type="range" id="lambda" min="0" max="2" step="0.25">
      <div class="ends"><span>just rank by enjoyment</span><span>bury the hooks</span></div>
    </div>
  </section>

  <button id="report" class="primary">Open “Your Brain on YouTube” →</button>
  <p class="privacy">All data stays on this computer.</p>

  <script src="popup.js"></script>
</body>
</html>
